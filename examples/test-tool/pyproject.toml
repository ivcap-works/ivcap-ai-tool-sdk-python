[project]
name = "test-tool"
version = "0.1.0"
description = "AI tool to test various platform aspects"
authors = [
    {name = "Max Ott",email = "max.ott@data61.csiro.au"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "ivcap-lambda[mcp]",
    "openai (>=1.95.1,<2.0.0)",
    # 'ivcap_service.testkit' (used by tool-service.py) requires >=0.7.0,
    # the first release that includes it.
    "ivcap-service (>=0.7.0,<0.8.0)"
]

[tool.poetry.dependencies]
# Use local path during development; switch to PyPI version constraint after publishing:
# ivcap-lambda = {version = ">=0.8.3,<0.9.0", extras = ["mcp"]}
ivcap-lambda = {path = "../..", develop = true, extras = ["mcp"]}
# ivcap_service.testkit requires >=0.7.0; use local path during development,
# switching to the PyPI version constraint above for published builds.
ivcap-service = {path = "../../../ivcap-service2-sdk-python", develop = true}

[tool.poetry-plugin-ivcap]
service-file = "tool-service.py"
service-id = "urn:ivcap:service:3165bf7f-5851-5c32-bbf5-3d89c476368e"
service-type = "lambda"
port = 8095
# policy = "urn:ivcap:policy:ivcap.open.metadata"


[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
